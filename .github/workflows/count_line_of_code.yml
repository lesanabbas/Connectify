name: Count Lines of Code in External Repo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  count_lines_of_code:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Clone external repository
        run: git clone https://github.com/lesanabbas/Connectify.git

      - name: Count lines of code in external repository and store output
        run: |
          cd Connectify
          cloc . --json > ../social_network/cloc_output.json  # This will store the output in the root folder

      - name: List files to confirm output file is in root directory
        run: ls -la  ../social_network # This will list files and you should see 'cloc_output.json' in the root folder
